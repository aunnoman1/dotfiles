# ============================================================
#  ~/.config/tmux/tmux.conf — Catppuccin Mocha · powerline
#  reload with: prefix + r
# ============================================================

# ---------- palette: Catppuccin Mocha ----------
%hidden CRUST=#11111b
%hidden BASE=#1e1e2e
%hidden MANTLE=#181825
%hidden SURFACE0=#313244
%hidden SURFACE1=#45475a
%hidden SUBTEXT0=#a6adc8
%hidden SUBTEXT1=#bac2de
%hidden TEXT=#cdd6f4
%hidden LAVENDER=#b4befe
%hidden BLUE=#89b4fa
%hidden MAUVE=#cba6f7
%hidden PEACH=#fab387
%hidden TEAL=#94e2d5
%hidden GREEN=#a6e3a1
%hidden YELLOW=#f9e2af
%hidden RED=#f38ba8

# ---------- true color (kept from old config) ----------
set-option -sa terminal-overrides ",xterm-kitty:RGB"
set -g default-terminal "tmux-256color"

# ---------- core behavior ----------
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g display-time 2000
set -g display-panes-time 1500
set -g repeat-time 400
set -g set-clipboard on
set -g set-titles on
set -g set-titles-string "#S:#I:#W"
set -g status-keys vi
set -g visual-activity off
set -g visual-bell off
set -g monitor-bell on

# ---------- pane borders ----------
set -g pane-border-style "fg=$SURFACE0"
set -g pane-active-border-style "fg=$MAUVE"
set -g pane-border-lines single

# ---------- popup styling (prefix + f / prefix + g) ----------
set -g popup-border-style "fg=$MAUVE"
set -g popup-style "bg=$BASE,fg=$TEXT"

# ---------- windows ----------
setw -g mode-keys vi
setw -g aggressive-resize on
setw -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format "#{?pane_current_path,#{b:pane_current_path},#{pane_current_command}}"
setw -g monitor-activity on

# ============================================================
#  status bar — top, powerline hard arrows into the bar bg
# ============================================================
set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style "fg=$TEXT,bg=$MANTLE"
set -g status-left-length 40
set -g status-right-length 60

# left: session chip (blue) with terminal icon
set -g status-left "#[fg=$CRUST,bg=$BLUE,bold]  #S #[fg=$BLUE,bg=$MANTLE]"

# window list: inactive surface0 / current mauve / activity yellow / bell red
set -g window-status-separator ""
set -g window-status-style "fg=$SUBTEXT0,bg=$SURFACE0"
set -g window-status-current-style "fg=$CRUST,bg=$MAUVE,bold"
set -g window-status-activity-style "fg=$YELLOW,bg=$SURFACE0,bold"
set -g window-status-bell-style "fg=$RED,bg=$SURFACE0,bold"
set -g window-status-last-style "fg=$SUBTEXT1,bg=$SURFACE0"
set -g window-status-format " #I #W#{?window_zoomed_flag,  ,} #[fg=$SURFACE0,bg=$MANTLE]"
set -g window-status-current-format " #I #W#{?window_zoomed_flag,  ,} #[fg=$MAUVE,bg=$MANTLE]"

# right: PREFIX indicator (only while prefix pressed), date, clock
# commas inside #[...] that sit within the #{?} conditional must be escaped: #,
set -g status-right "#{?client_prefix,#[fg=$CRUST#,bg=$RED#,bold] PREFIX #[fg=$RED#,bg=$MANTLE],}#[fg=$TEAL,bg=$MANTLE]#[fg=$CRUST,bg=$TEAL]  %d %b #[fg=$GREEN,bg=$MANTLE]#[fg=$CRUST,bg=$GREEN]  %H:%M "

# ============================================================
#  key bindings
# ============================================================
# splits in current window's cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane movement and resizing (repeatable after prefix)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# reload config
bind r source-file /home/aunno/.config/tmux/tmux.conf \; display-message "  tmux.conf reloaded"

# fzf popups
bind f display-popup -E -w 70% -h 60% -B rounded "/home/aunno/.config/tmux/scripts/popup-sessions.sh"
bind g display-popup -E -w 70% -h 60% -B rounded "/home/aunno/.config/tmux/scripts/popup-windows.sh"

# ---------- copy mode: vi keys + yank to Wayland clipboard ----------
set -g mode-style "fg=$YELLOW,bg=$SURFACE1"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
