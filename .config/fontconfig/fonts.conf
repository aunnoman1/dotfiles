<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Add standard font directories -->
  <dir>~/.local/share/fonts</dir>
  <dir>~/.fonts</dir>
  <dir>/usr/share/fonts</dir>

  <!-- Emoji fallback (optional but fine) -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
