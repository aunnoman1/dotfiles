# Catppuccin wallpapers, rotating every 15 minutes in random order.
# Add/remove images by dropping symlinks into ~/Wallpapers/rotation/{main,portrait}.

wallpaper {
    monitor  = DP-2
    path     = /home/aunno/Wallpapers/rotation/main
    fit_mode = cover
    timeout  = 900
    order    = random
}

wallpaper {
    monitor  = DP-3
    path     = /home/aunno/Wallpapers/rotation/portrait
    fit_mode = cover
    timeout  = 900
    order    = random
}

splash = false
