# hyprlock — Catppuccin Mocha, same layout as the SDDM theme (~/.local/share/sddm-rice)
# Background follows the wallpaper on DP-2 (symlink refreshed by ~/.local/bin/lock).
# The login card only shows on DP-2; the portrait monitor just gets the clock.
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace

$font     = Adwaita Sans
$icons    = JetBrainsMono Nerd Font
$text     = rgb(cdd6f4)
$subtext  = rgb(a6adc8)
$overlay  = rgb(6c7086)
$main     = DP-2

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 6, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
    animation = inputFieldColors, 1, 3, easeOut
}

background {
    monitor = DP-3
    path = ~/.cache/hyprlock/background-portrait
    blur_passes = 4
    blur_size = 8
    brightness = 0.7
    contrast = 0.95
    vibrancy = 0.15
    noise = 0.012
}

background {
    monitor = $main
    path = ~/.cache/hyprlock/background
    blur_passes = 4
    blur_size = 8
    brightness = 0.7
    contrast = 0.95
    vibrancy = 0.15
    noise = 0.012
}

# ---------- clock ----------
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 150
    font_family = $font Light
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(11111b66)
    position = 0, 400
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $subtext
    font_size = 22
    font_family = $font
    position = 0, 270
    halign = center
    valign = center
}

# ---------- login card ----------
shape {
    monitor = $main
    size = 460, 360
    color = rgba(1e1e2e8c)
    rounding = 32
    border_size = 1
    border_color = rgba(cdd6f41a)
    position = 0, -10
    halign = center
    valign = center
}

image {
    monitor = $main
    path = ~/.face
    size = 128
    rounding = -1
    border_size = 4
    border_color = rgba(cba6f7ff) rgba(89b4faff) 45deg
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor = $main
    text = $USER
    color = $text
    font_size = 20
    font_family = $font SemiBold
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor = $main
    size = 380, 58
    outline_thickness = 2
    rounding = -1

    outer_color = rgba(cdd6f41a)
    inner_color = rgba(313244d9)
    font_color = $text
    check_color = rgba(cba6f7ff) rgba(89b4faff) 45deg
    fail_color = rgba(f38ba8ff)
    capslock_color = rgba(fab387ff)

    font_family = $font
    placeholder_text = <span foreground="##6c7086">󰌾   Password</span>
    fail_text = <span foreground="##f38ba8">Wrong password</span>
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true

    position = 0, -120
    halign = center
    valign = center
}

# ---------- now playing ----------
label {
    monitor = $main
    text = cmd[update:2000] ~/.local/bin/lock-nowplaying
    color = $subtext
    font_size = 13
    font_family = $icons
    position = 0, 45
    halign = center
    valign = bottom
}
